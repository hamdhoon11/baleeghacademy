[project]
name = "baleegh-portal"
version = "0.8.50"
requires-python = ">=3.9"
# Vercel installs THESE (not requirements.txt). Keep the two lists the same: tests/test_session50.py checks it.
dependencies = [
    "Flask>=3.0,<3.2",
    "PyJWT>=2.8",
    "gunicorn>=21.2",
    "reportlab>=4.0",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
    "openpyxl>=3.1",
]

[tool.vercel]
entrypoint = "app:app"
